  implementation-packet:
    name: Build implementation packet without provider secrets
    if: inputs.command == 'implement'
    needs: [claim, prepare, mark-running]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out immutable trusted tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.trusted_tool_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Install trusted CountyForge packages
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Provision trusted OpenSpec validator
        run: |
          npm install --global --prefix "$RUNNER_TEMP/openspec-packet-tool" \
            --ignore-scripts --no-audit --no-fund "@fission-ai/openspec@1.6.0"
          test -x "$RUNNER_TEMP/openspec-packet-tool/bin/openspec"
          echo "$RUNNER_TEMP/openspec-packet-tool/bin" >> "$GITHUB_PATH"
      - name: Build accepted implementation packet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER_B64: ${{ inputs.trigger }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          TARGET_NUMBER: ${{ inputs.target_number }}
          TRUSTED_SHA: ${{ inputs.trusted_tool_sha }}
        run: |
          python3 - "$TRIGGER_B64" "$RUNNER_TEMP/countyforge-trigger.json" <<'PY'
          import base64, pathlib, sys
          pathlib.Path(sys.argv[2]).write_bytes(base64.urlsafe_b64decode(sys.argv[1] + "=" * (-len(sys.argv[1]) % 4)))
          PY
          gh api "repos/$TARGET_REPOSITORY/issues/$TARGET_NUMBER" > "$RUNNER_TEMP/countyforge-issue.json"
          change_name="$(jq -er '.command.arguments.openspec_change' "$RUNNER_TEMP/countyforge-trigger.json")"
          approval_actor_id="$(jq -er '.implementation_approval.approval_actor_id' "$RUNNER_TEMP/countyforge-trigger.json")"
          # Early fail-closed shape check only; Python eligibility validation remains
          # authoritative. `IN` takes one or two arguments, so the three-argument form
          # was a compile error on the runner's jq, not a failed check.
          jq -e \
            '(.implementation_approval.planning_pr_number | type == "number" and . > 0 and floor == .) and
             (.implementation_approval.planning_pr_merge_sha | type == "string" and test("^[0-9a-f]{40}$")) and
             (.implementation_approval.approval_permission as $permission
              | ($permission | type) == "string"
                and (["admin", "maintain", "write"] | index($permission) != null))' \
            "$RUNNER_TEMP/countyforge-trigger.json" >/dev/null
          cd trusted
          uv sync --frozen --package countyforge-github
          uv run --package countyforge-github countyforge-github build-implementation-packet \
            --trigger "$RUNNER_TEMP/countyforge-trigger.json" \
            --issue "$RUNNER_TEMP/countyforge-issue.json" \
            --change-name "$change_name" \
            --planning-pr-merged \
            --approval-actor-id "$approval_actor_id" \
            --output-dir "$RUNNER_TEMP/countyforge-implementation"
      - name: Upload frozen implementation packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: countyforge-implementation-packet-${{ inputs.run_id }}
          path: ${{ runner.temp }}/countyforge-implementation
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

