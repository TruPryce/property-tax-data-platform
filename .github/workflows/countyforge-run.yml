          path: |
            ${{ runner.temp }}/countyforge-workspace.tar.gz
            ${{ runner.temp }}/frozen-implementation-result/countyforge-implementation-result.json
          if-no-files-found: error
          retention-days: 14

  implementation-validation:
    name: Trusted implementation validation
    if: always() && inputs.command == 'implement' && needs.claim.result == 'success'
    needs: [claim, implementation-packet, implementation-openai, implementation-sakana]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out immutable trusted tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.trusted_tool_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Download selected-provider implementation artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-implementation-result-${{ needs.claim.outputs.provider }}-${{ inputs.run_id }}
          path: ${{ runner.temp }}/implementation-result
      - name: Download selected-provider frozen implementation bundle
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-implementation-bundle-${{ needs.claim.outputs.provider }}-${{ inputs.run_id }}
          path: ${{ runner.temp }}/implementation-result
      - name: Require the selected implementation provider lane
        env:
          SELECTED_PROVIDER: ${{ needs.claim.outputs.provider }}
          OPENAI_RESULT: ${{ needs.implementation-openai.result }}
          SAKANA_RESULT: ${{ needs.implementation-sakana.result }}
        run: |
          # Exactly one provider lane may execute. An unimplemented or unknown
          # provider, or both lanes running, is a routing defect and must never
          # reach validation.
          case "$SELECTED_PROVIDER" in
            openai|sakana) ;;
            *) echo "::error::Unsupported implementation provider: ${SELECTED_PROVIDER:-unset}"; exit 2 ;;
          esac
          ran=0
          [ "$OPENAI_RESULT" != "skipped" ] && ran=$((ran + 1))
          [ "$SAKANA_RESULT" != "skipped" ] && ran=$((ran + 1))
          if [ "$ran" -ne 1 ]; then
            echo "::error::Expected exactly one implementation provider lane; openai=$OPENAI_RESULT sakana=$SAKANA_RESULT"
            exit 2
          fi
          selected_result="$OPENAI_RESULT"
          [ "$SELECTED_PROVIDER" = "sakana" ] && selected_result="$SAKANA_RESULT"
          if [ "$selected_result" = "skipped" ]; then
            echo "::error::The selected provider lane ($SELECTED_PROVIDER) did not run"
            exit 2
          fi
          # Fail closed when the selected lane produced no result evidence, so a
          # provider or image provisioning failure can never be validated as a
          # model outcome.
          if [ ! -s "$RUNNER_TEMP/implementation-result/countyforge-result.json" ]; then
            echo "::error::Selected provider ($SELECTED_PROVIDER) published no implementation result; treating as provider_infrastructure_failed"
            exit 2
          fi
          echo "selected implementation provider: $SELECTED_PROVIDER"
      - name: Download frozen implementation packet
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-implementation-packet-${{ inputs.run_id }}
          path: ${{ runner.temp }}/implementation-packet
      - name: Install trusted CountyForge packages
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Provision the no-network command sandbox
        env:
          # Trust boundary: pinned in this review-gated workflow file and verified against the
          # trusted checkout's helper bytes before any sudo action. Only the verified copy runs.
          COUNTYFORGE_BWRAP_HELPER_SHA256: f23b37dd7af48cf398af37be80c7fefa3b78285ffa6c138c9de2ca1a3d7a2e52 # pragma: allowlist secret
        run: |
          verified_helper="$RUNNER_TEMP/configure_bwrap_apparmor.verified.sh"
          # Fail closed: the sudo-bearing helper is executed only from the immutable trusted
          # checkout (pinned to inputs.trusted_tool_sha). If it is absent, stop before any
          # privileged action rather than falling back to any other copy.
          if [ ! -f ./trusted/scripts/ci/configure_bwrap_apparmor.sh ]; then
            echo "::error::Trusted Bubblewrap AppArmor helper is unavailable in the trusted checkout; refusing to run any privileged sandbox setup." >&2
            exit 2
          fi
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes bubblewrap
          fi
          bwrap --version
          install -m 0755 ./trusted/scripts/ci/configure_bwrap_apparmor.sh "$verified_helper"
          printf '%s  %s\n' "$COUNTYFORGE_BWRAP_HELPER_SHA256" "$verified_helper" | sha256sum -c -
          "$verified_helper"
      - name: Provision pinned OpenSpec validator for offline gates
        run: |
          npm install --prefix "$GITHUB_WORKSPACE/trusted/.ai/tools/openspec" \
            --ignore-scripts --no-audit --no-fund "@fission-ai/openspec@1.6.0"
          test -x "$GITHUB_WORKSPACE/trusted/.ai/tools/openspec/node_modules/.bin/openspec"
      - name: Validate artifact and trusted gates
        env:
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          BASE_SHA: ${{ needs.claim.outputs.base_sha }}
          ISSUE_NUMBER: ${{ inputs.target_number }}
          COMMAND_EVENTS_PATH: ${{ runner.temp }}/implementation-command-events.ndjson
        run: |
          result_file="$RUNNER_TEMP/implementation-result/countyforge-result.json"
          test -f "$result_file"
          implementation_file="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-implementation-result.json -type f -print -quit || true)"
          test -n "$implementation_file"
          workspace_archive="$RUNNER_TEMP/implementation-result/countyforge-workspace.tar.gz"
          test -f "$workspace_archive"
          change_name="$(jq -er '.implementation.openspec_change' "$result_file")"
          mkdir -p "$RUNNER_TEMP/implementation-workspace"
          tar -xzf "$workspace_archive" -C "$RUNNER_TEMP/implementation-workspace"
          packet_file="$(find "$RUNNER_TEMP/implementation-packet" -name countyforge-implementation-packet.json -type f -print -quit || true)"
          manifest_file="$(find "$RUNNER_TEMP/implementation-packet" -name countyforge-implementation-context-manifest.json -type f -print -quit || true)"
          task_file="$(find "$RUNNER_TEMP/implementation-packet" -name countyforge-implementation-task-plan.json -type f -print -quit || true)"
          test -n "$packet_file" && test -n "$manifest_file" && test -n "$task_file"
          cd trusted
          uv sync --frozen --all-packages --group dev
          uv run --package countyforge-github countyforge-github validate-implementation-context \
            --packet "$packet_file" --manifest "$manifest_file" --task-plan "$task_file"
          python3 - "$packet_file" "$manifest_file" "$task_file" "$result_file" "$COUNTYFORGE_RUN_ID" "$BASE_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          packet_path, manifest_path, task_path, result_path, run_id, base_sha = sys.argv[1:]
          packet = json.loads(pathlib.Path(packet_path).read_text(encoding="utf-8"))
          manifest = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))
          task_plan = json.loads(pathlib.Path(task_path).read_text(encoding="utf-8"))
          runner = json.loads(pathlib.Path(result_path).read_text(encoding="utf-8"))
          implementation = runner["implementation"]
          change_name = implementation["openspec_change"]
          if packet["run_id"] != run_id or packet["trusted_base_sha"] != base_sha or packet["change"]["name"] != change_name:
              raise SystemExit("implementation packet provenance mismatch")
          if implementation["implementation_revision"] != packet["implementation_revision"]:
              raise SystemExit("implementation revision mismatch")
          if manifest["packet_sha256"] != hashlib.sha256(pathlib.Path(packet_path).read_bytes()).hexdigest():
              raise SystemExit("implementation packet hash mismatch")
          if manifest["run_id"] != run_id or manifest["trusted_base_sha"] != base_sha or task_plan["run_id"] != run_id or task_plan["change_name"] != change_name:
              raise SystemExit("implementation manifest provenance mismatch")
          PY
          uv run --package countyforge-github countyforge-github validate-implementation-artifact \
            --result "$implementation_file" \
            --manifest "$RUNNER_TEMP/implementation-workspace/countyforge-workspace-manifest.json" \
            --workspace "$RUNNER_TEMP/implementation-workspace" \
            --policy-root "$GITHUB_WORKSPACE/trusted" \
            --run-id "$COUNTYFORGE_RUN_ID" --issue-number "$ISSUE_NUMBER" \
            --change-name "$change_name" --base-sha "$BASE_SHA"
          candidate_root="$RUNNER_TEMP/implementation-candidate"
          git clone --quiet --no-local --no-hardlinks \
            --config core.hooksPath=/dev/null \
            --config core.fsmonitor=false \
            --config credential.helper= \
            "$GITHUB_WORKSPACE/trusted" "$candidate_root"
          git -C "$candidate_root" config --local core.hooksPath /dev/null
          git -C "$candidate_root" config --local core.fsmonitor false
          git -C "$candidate_root" config --local credential.helper ""
          test "$(git -C "$candidate_root" rev-parse HEAD)" = "$BASE_SHA"
          # Reuse only trusted, pre-provisioned developer tooling; never overlay model
          # files onto the trusted checkout that runs the validators.
          if [ -d "$GITHUB_WORKSPACE/trusted/.venv" ]; then
            cp -a "$GITHUB_WORKSPACE/trusted/.venv" "$candidate_root/.venv"
          fi
          python3 - "$RUNNER_TEMP/implementation-workspace/countyforge-workspace-manifest.json" "$RUNNER_TEMP/implementation-workspace" "$candidate_root" <<'PY'
          import json, pathlib, shutil, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          source_root = pathlib.Path(sys.argv[2]).resolve()
          target_root = pathlib.Path(sys.argv[3]).resolve()
          for row in manifest["files"]:
              relative = pathlib.PurePosixPath(row["path"])
              source = (source_root / relative).resolve()
              target = (target_root / relative).resolve()
              if not source.is_relative_to(source_root) or not target.is_relative_to(target_root):
                  raise SystemExit("implementation artifact escaped its approved root")
              if row["kind"] == "deleted":
                  if target.exists():
                      target.unlink()
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY
          export PATH="$GITHUB_WORKSPACE/trusted/.ai/tools/openspec/node_modules/.bin:$PATH"
          # The broker mounts only this reviewed executable copy and the contract root;
          # it must not resolve a runner-home uv binary through the masked host filesystem.
          mkdir -p "$GITHUB_WORKSPACE/trusted/.ai/tools/uv-runtime"
          cp "$(command -v uv)" "$GITHUB_WORKSPACE/trusted/.ai/tools/uv-runtime/uv"
          chmod 0755 "$GITHUB_WORKSPACE/trusted/.ai/tools/uv-runtime/uv"
          export PATH="$GITHUB_WORKSPACE/trusted/.ai/tools/uv-runtime:$PATH"
          command_registry="$GITHUB_WORKSPACE/trusted/.ai/policies/countyforge-implementation-commands.v1.json"
          command_schema="$GITHUB_WORKSPACE/trusted/.ai/schemas/countyforge-implementation-command-registry.schema.json"
          validation_failed=0
          validation_failures=()
          run_registered() {
            command_id="$1"
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            set +e
            evidence="$(uv run --package countyforge-github countyforge-github run-implementation-command \
              --command-id "$command_id" --registry "$command_registry" --schema "$command_schema" \
              --workspace "$candidate_root" --contract-root "$GITHUB_WORKSPACE/trusted" \
              --run-id "$COUNTYFORGE_RUN_ID" \
              --toolchain-root "$GITHUB_WORKSPACE/trusted/.ai/tools/uv-runtime")"
            exit_code=$?
            set -e
            finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if jq -e '.evidence | type == "object"' <<<"$evidence" >/dev/null 2>&1; then
              jq -c '.evidence' <<<"$evidence" >> "$COMMAND_EVENTS_PATH"
            else
              error_hash="$(printf '%s' "$evidence" | sha256sum | cut -d' ' -f1)"
              jq -cn --arg run_id "$COUNTYFORGE_RUN_ID" --arg command_id "$command_id" \
                --arg started "$started_at" --arg finished "$finished_at" \
                --arg hash "$error_hash" \
                '{contract_version:1,run_id:$run_id,command_id:$command_id,phase:"validate",started_at:$started,finished_at:$finished,exit_code:null,stdout_sha256:$hash,stderr_sha256:$hash,output_bytes:0,truncated:false,network_policy:"disabled",workspace_revision:"unknown",workspace_mutating:false}' \
                >> "$COMMAND_EVENTS_PATH"
            fi
            if [ "$exit_code" -ne 0 ]; then
              validation_failed=1
              validation_failures+=("$command_id failed")
            fi
          }
          : > "$COMMAND_EVENTS_PATH"
          run_registered artifacts.check
          run_registered docs.links
          run_registered repo.check
          run_registered repo.runner-contract
          run_registered repo.prepr-no-ai
          set +e
          uv run --package countyforge-github countyforge-github validate-implementation-result \
            --result "$implementation_file" --task-plan "$task_file" \
            --workspace "$candidate_root" \
            --expected-revision "$(jq -er '.implementation_revision' "$packet_file")" \
            --command-events "$COMMAND_EVENTS_PATH"
          result_validation_exit=$?
          set -e
          if [ "$result_validation_exit" -ne 0 ]; then
            validation_failed=1
            validation_failures+=("implementation-result reconciliation failed")
          fi
          artifact_sha256="$(sha256sum "$implementation_file" | cut -d' ' -f1)"
          manifest_sha256="$(sha256sum "$RUNNER_TEMP/implementation-workspace/countyforge-workspace-manifest.json" | cut -d' ' -f1)"
          gates_json="$(jq -c -s 'map({name:.command_id,status:(if .exit_code == 0 then "passed" else "failed" end),exit_code:.exit_code})' "$COMMAND_EVENTS_PATH")"
          if [ "$validation_failed" -ne 0 ]; then
            failures_json="$(printf '%s\n' "${validation_failures[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            jq -cn --arg run_id "$COUNTYFORGE_RUN_ID" --argjson issue "$ISSUE_NUMBER" \
              --arg change "$change_name" --arg base "$BASE_SHA" --arg artifact "$artifact_sha256" \
              --arg manifest "$manifest_sha256" --argjson gates "$gates_json" \
              --argjson failures "$failures_json" \
              '{contract_version:1,run_id:$run_id,issue_number:$issue,change_name:$change,valid:false,publication_eligible:false,base_sha:$base,artifact_sha256:$artifact,workspace_manifest_sha256:$manifest,gates:$gates,failures:$failures,warnings:[]}' \
              > "$RUNNER_TEMP/implementation-validation.json"
            uv run --package countyforge-github countyforge-github validate-implementation-report \
              --report "$RUNNER_TEMP/implementation-validation.json" >/dev/null || true
            exit 5
          fi
          jq -cn --arg run_id "$COUNTYFORGE_RUN_ID" --argjson issue "$ISSUE_NUMBER" \
            --arg change "$change_name" --arg base "$BASE_SHA" --arg artifact "$artifact_sha256" \
            --arg manifest "$manifest_sha256" --argjson gates "$gates_json" \
            '{contract_version:1,run_id:$run_id,issue_number:$issue,change_name:$change,valid:true,publication_eligible:true,base_sha:$base,artifact_sha256:$artifact,workspace_manifest_sha256:$manifest,gates:$gates,failures:[],warnings:[]}' \
            > "$RUNNER_TEMP/implementation-validation.json"
          uv run --package countyforge-github countyforge-github validate-implementation-report \
            --report "$RUNNER_TEMP/implementation-validation.json" >/dev/null
      - name: Ensure failed validation evidence exists
        if: always()
        env:
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          ISSUE_NUMBER: ${{ inputs.target_number }}
          COMMAND_EVENTS_PATH: ${{ runner.temp }}/implementation-command-events.ndjson
        run: |
          report="$RUNNER_TEMP/implementation-validation.json"
          if [ ! -f "$report" ]; then
            jq -n --arg run_id "$COUNTYFORGE_RUN_ID" --argjson issue "$ISSUE_NUMBER" \
              '{contract_version:1,run_id:$run_id,issue_number:$issue,change_name:"unknown",valid:false,publication_eligible:false,base_sha:("0" * 40),artifact_sha256:("0" * 64),workspace_manifest_sha256:("0" * 64),gates:[],failures:["implementation_validation_setup_failed"],warnings:[]}' \
              > "$report"
          fi
          test -f "$COMMAND_EVENTS_PATH" || : > "$COMMAND_EVENTS_PATH"
      - name: Upload trusted validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: countyforge-implementation-validation-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/implementation-validation.json
            ${{ runner.temp }}/implementation-command-events.ndjson
          if-no-files-found: error
          retention-days: 14

  implementation-publication-prep:
    name: Prepare implementation publication evidence
    if: always() && inputs.command == 'implement' && needs.claim.result == 'success'
    needs: [claim, implementation-openai, implementation-sakana, implementation-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out immutable trusted tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.trusted_tool_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Download selected-provider implementation result evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-implementation-result-${{ needs.claim.outputs.provider }}-${{ inputs.run_id }}
          path: ${{ runner.temp }}/implementation-result
      - name: Download selected-provider frozen implementation bundle
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-implementation-bundle-${{ needs.claim.outputs.provider }}-${{ inputs.run_id }}
          path: ${{ runner.temp }}/implementation-result
      - name: Download trusted validation report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-implementation-validation-${{ inputs.run_id }}
          path: ${{ runner.temp }}/implementation-validation
      - name: Install trusted CountyForge packages
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Resolve implementation terminal evidence
        env:
          SELECTED_PROVIDER: ${{ needs.claim.outputs.provider }}
          OPENAI_LANE: ${{ needs.implementation-openai.result }}
          SAKANA_LANE: ${{ needs.implementation-sakana.result }}
        run: |
          result_file="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-result.json -type f -print -quit 2>/dev/null || true)"
          exit_file="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-exit-code -type f -print -quit 2>/dev/null || true)"
          cd trusted
          # A lane that published nothing never reached the model. Classify that
          # first so terminal state records a provider infrastructure failure
          # instead of reporting a model outcome for an image that never built.
          lane_evidence="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-implementation-lane-evidence.json -type f -print -quit 2>/dev/null || true)"
          freeze_outcome="unknown"
          bundle_present="false"
          implementation_present="false"
          if [ -n "$lane_evidence" ]; then
            freeze_outcome="$(jq -r '.freeze_outcome // "unknown"' "$lane_evidence")"
            bundle_present="$(jq -r 'if .frozen_bundle_present then "true" else "false" end' "$lane_evidence")"
            # Observed before freezing, so a freeze failure is not mistaken for a
            # model that produced no result.
            implementation_present="$(jq -r 'if .implementation_result_present then "true" else "false" end' "$lane_evidence")"
            adapter_disposition="$(jq -r '.adapter_disposition // ""' "$lane_evidence")"
          fi
          implementation_result="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-implementation-result.json -type f -print -quit 2>/dev/null || true)"
          lane_arguments=(classify-implementation-lane --selected-provider "$SELECTED_PROVIDER"
            --lane-result "openai=$OPENAI_LANE" --lane-result "sakana=$SAKANA_LANE"
            --freeze-outcome "$freeze_outcome" --frozen-bundle-present "$bundle_present"
            --implementation-result-present "$implementation_present")
          if [ -n "${adapter_disposition:-}" ]; then
            lane_arguments+=(--adapter-disposition "$adapter_disposition")
          fi
          # The sanitized evidence already carries a bounded event summary; a
          # timeout that emitted nothing beyond `turn.started` is a different
          # problem from one that stopped mid-generation, and only this file
          # knows which happened.
          events_summary="$(find "$RUNNER_TEMP" -name countyforge-implementation-model-events.summary.json -type f -print -quit 2>/dev/null || true)"
          if [ -n "$events_summary" ] && jq -e '.model_events_present == true' "$events_summary" >/dev/null 2>&1; then
            observed="$(jq -r 'if .output_event_observed then "true" else "false" end' "$events_summary")"
            lane_arguments+=(--model-output-observed "$observed")
          fi
          if [ -n "$result_file" ]; then lane_arguments+=(--result "$result_file"); fi
          if [ -n "$exit_file" ]; then lane_arguments+=(--exit-code "$exit_file"); fi
          if [ -n "$implementation_result" ]; then lane_arguments+=(--implementation-result "$implementation_result"); fi
          uv run --package countyforge-github countyforge-github "${lane_arguments[@]}" \
            > "$RUNNER_TEMP/countyforge-implementation-lane.json"
          arguments=(resolve-terminal-result --command implement
            --lane "$RUNNER_TEMP/countyforge-implementation-lane.json")
          if [ -n "$result_file" ]; then arguments+=(--result "$result_file"); fi
          if [ -n "$exit_file" ]; then arguments+=(--exit-code "$exit_file"); fi
          uv run --package countyforge-github countyforge-github "${arguments[@]}" \
            > "$RUNNER_TEMP/countyforge-terminal.json"
      - name: Verify trusted validation eligibility
        env:
          EXPECTED_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_BASE_SHA: ${{ needs.claim.outputs.base_sha }}
        run: |
          report="$RUNNER_TEMP/implementation-validation/implementation-validation.json"
          test -f "$report"
          jq -e --arg run_id "$EXPECTED_RUN_ID" --arg base_sha "$EXPECTED_BASE_SHA" \
            '.valid == true and .publication_eligible == true and .run_id == $run_id and .base_sha == $base_sha' \
            "$report" >/dev/null
      - name: Upload publication preparation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: countyforge-implementation-publication-prep-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/implementation-result
            ${{ runner.temp }}/implementation-validation
            ${{ runner.temp }}/countyforge-implementation-lane.json
            ${{ runner.temp }}/countyforge-terminal.json
          if-no-files-found: warn
          retention-days: 14

  implementation-publish:
    name: Publish implementation draft and terminal state
    if: always() && inputs.command == 'implement' && needs.claim.result == 'success'
    needs: [claim, mark-running, implementation-publication-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: countyforge-state-${{ github.repository_id }}-${{ inputs.target_type }}-${{ inputs.target_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out immutable trusted tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.trusted_tool_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Download implementation artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-implementation-publication-prep-${{ inputs.run_id }}
          path: ${{ runner.temp }}/implementation-result
      - name: Install trusted CountyForge packages
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Resolve implementation terminal evidence
        id: terminal
        run: |
          terminal_file="$RUNNER_TEMP/implementation-result/countyforge-terminal.json"
          test -f "$terminal_file"
          echo "state=$(jq -r .state "$terminal_file")" >> "$GITHUB_OUTPUT"
          echo "disposition=$(jq -r .disposition "$terminal_file")" >> "$GITHUB_OUTPUT"
      - name: Verify trusted validation eligibility
        id: validation
        env:
          EXPECTED_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_BASE_SHA: ${{ needs.claim.outputs.base_sha }}
        if: steps.terminal.outputs.state == 'succeeded' && steps.terminal.outputs.disposition == 'completed'
        run: |
          report="$RUNNER_TEMP/implementation-result/implementation-validation/implementation-validation.json"
          test -f "$report"
          jq -e --arg run_id "$EXPECTED_RUN_ID" --arg base_sha "$EXPECTED_BASE_SHA" \
            '.valid == true and .publication_eligible == true and .run_id == $run_id and .base_sha == $base_sha' \
            "$report" >/dev/null
      - name: Verify live implementation publication lease
        id: verify-publication
        if: steps.terminal.outputs.state == 'succeeded' && needs.implementation-publication-prep.result == 'success' && steps.validation.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          EXECUTION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          LEASE_NONCE: ${{ needs.claim.outputs.nonce }}
        run: |
          cd trusted
          uv sync --frozen --package countyforge-github
          uv run --package countyforge-github countyforge-github verify-publication \
            --repository "$TARGET_REPOSITORY" --status-comment-id "$STATUS_COMMENT_ID" \
            --trusted-bot-id 41898282 --idempotency-key "$IDEMPOTENCY_KEY" \
            --run-id "$COUNTYFORGE_RUN_ID" --workflow-run-id "$EXECUTION_WORKFLOW_RUN_ID" \
            --nonce "$LEASE_NONCE" --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
      - name: Publish validated implementation draft
        id: implementation-publication
        if: steps.terminal.outputs.state == 'succeeded' && needs.implementation-publication-prep.result == 'success' && steps.validation.outcome == 'success' && steps.verify-publication.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          ISSUE_NUMBER: ${{ inputs.target_number }}
          TARGET_SHA: ${{ needs.claim.outputs.base_sha }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          EXECUTION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          LEASE_NONCE: ${{ needs.claim.outputs.nonce }}
        run: |
          implementation_file="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-implementation-result.json -type f -print -quit)"
          change_name="$(jq -er '.openspec_change' "$implementation_file")"
          mkdir -p "$RUNNER_TEMP/implementation-workspace"
          workspace_archive="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-workspace.tar.gz -type f -print -quit)"
          test -n "$workspace_archive"
          tar -xzf "$workspace_archive" -C "$RUNNER_TEMP/implementation-workspace"
          cd trusted
          uv sync --frozen --package countyforge-github
          publication="$({ uv run --package countyforge-github countyforge-github publish-implementation \
            --repository "$TARGET_REPOSITORY" --issue-number "$ISSUE_NUMBER" --change-name "$change_name" \
            --revision "$(jq -er '.implementation_revision' "$implementation_file")" \
            --base-sha "$TARGET_SHA" --run-id "$COUNTYFORGE_RUN_ID" \
            --workspace "$RUNNER_TEMP/implementation-workspace" \
            --evidence-url "$EVIDENCE_URL" --status-comment-id "${STATUS_COMMENT_ID}" \
            --trusted-bot-id 41898282 --idempotency-key "$IDEMPOTENCY_KEY" \
            --workflow-run-id "$EXECUTION_WORKFLOW_RUN_ID" --nonce "$LEASE_NONCE" \
            --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --implementation-result "$implementation_file" --policy-root "$GITHUB_WORKSPACE/trusted" \
            --validation-report "$RUNNER_TEMP/implementation-result/implementation-validation/implementation-validation.json"; })"
          printf '%s\n' "$publication"
          echo "branch=$(jq -r '.branch' <<<"$publication")" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r '.pr_number' <<<"$publication")" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(jq -r '.commit_sha' <<<"$publication")" >> "$GITHUB_OUTPUT"
          echo "change_name=$(jq -r '.change_name // .openspec_change // empty' <<<"$publication")" >> "$GITHUB_OUTPUT"
      - name: Finalize canonical implementation state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          EXECUTION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          LEASE_NONCE: ${{ needs.claim.outputs.nonce }}
          TERMINAL_STATE: ${{ steps.terminal.outputs.state }}
          TERMINAL_DISPOSITION: ${{ steps.terminal.outputs.disposition }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMPLEMENTATION_BRANCH: ${{ steps.implementation-publication.outputs.branch }}
          IMPLEMENTATION_PR_NUMBER: ${{ steps.implementation-publication.outputs.pr_number }}
          IMPLEMENTATION_CHANGE_NAME: ${{ steps.implementation-publication.outputs.change_name }}
          IMPLEMENTATION_ELIGIBLE: ${{ steps.validation.outcome == 'success' && steps.terminal.outputs.state == 'succeeded' && needs.implementation-publication-prep.result == 'success' }}
          IMPLEMENTATION_VALIDATION_RESULT: ${{ needs.implementation-publication-prep.result }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          VERIFY_PUBLICATION_OUTCOME: ${{ steps.verify-publication.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.implementation-publication.outcome }}
        run: |
          cd trusted
          publication_journal="$(find "$RUNNER_TEMP/implementation-workspace" -name .countyforge-publication-journal.json -type f -print -quit 2>/dev/null || true)"
          if [ -n "$publication_journal" ]; then
            # Preserve every irreversible publication fact even when a later GitHub API
            # call fails and the publication step exits nonzero.
            IMPLEMENTATION_BRANCH="$(jq -r '.branch // empty' "$publication_journal")"
            IMPLEMENTATION_PR_NUMBER="$(jq -r '.pr_number // empty' "$publication_journal")"
            IMPLEMENTATION_CHANGE_NAME="$(jq -r '.change_name // empty' "$publication_journal")"
          fi
          final_state="$TERMINAL_STATE"
          final_disposition="$TERMINAL_DISPOSITION"
          if [ "$TERMINAL_STATE" = "succeeded" ]; then
            if [ "$IMPLEMENTATION_VALIDATION_RESULT" != "success" ] || \
               [ "$VALIDATION_OUTCOME" != "success" ]; then
              final_state="failed"
              final_disposition="implementation_validation_failed"
            elif [ "$VERIFY_PUBLICATION_OUTCOME" != "success" ] || \
                 [ "$PUBLICATION_OUTCOME" != "success" ]; then
              final_state="failed"
              final_disposition="implementation_publication_failed"
            fi
          fi
          implementation_file="$(find "$RUNNER_TEMP/implementation-result" -name countyforge-implementation-result.json -type f -print -quit 2>/dev/null || true)"
          implementation_args=()
          if [ -n "$IMPLEMENTATION_CHANGE_NAME" ]; then implementation_args+=(--implementation-change-name "$IMPLEMENTATION_CHANGE_NAME"); fi
          if [ -n "$IMPLEMENTATION_BRANCH" ]; then implementation_args+=(--implementation-branch "$IMPLEMENTATION_BRANCH"); fi
          if [ -n "$IMPLEMENTATION_PR_NUMBER" ] && [ "$IMPLEMENTATION_PR_NUMBER" != "null" ]; then implementation_args+=(--implementation-pr-number "$IMPLEMENTATION_PR_NUMBER"); fi
          if [ -n "$implementation_file" ]; then
            implementation_args+=(--implementation-revision "$(jq -r '.implementation_revision // 1' "$implementation_file")")
            implementation_args+=(--implementation-completed-task-count "$(jq -r '.completed_task_ids | length' "$implementation_file")")
            implementation_args+=(--implementation-incomplete-task-count "$(jq -r '.incomplete_task_ids | length' "$implementation_file")")
            implementation_args+=(--implementation-blocked-task-count "$(jq -r '.blocked_task_ids | length' "$implementation_file")")
          fi
          implementation_args+=(--implementation-eligible "$IMPLEMENTATION_ELIGIBLE")
          uv run --package countyforge-github countyforge-github advance-run \
            --repository "$TARGET_REPOSITORY" --status-comment-id "$STATUS_COMMENT_ID" \
            --trusted-bot-id 41898282 --idempotency-key "$IDEMPOTENCY_KEY" --run-id "$COUNTYFORGE_RUN_ID" \
            --workflow-run-id "$EXECUTION_WORKFLOW_RUN_ID" --nonce "$LEASE_NONCE" \
            --target-state "$final_state" --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --disposition "$final_disposition" \
            --evidence-url "$EVIDENCE_URL" \
            "${implementation_args[@]}"

  plan-validation:
    name: Materialize and validate planning draft
    if: always() && inputs.command == 'plan' && needs.claim.result == 'success'
    needs: [claim, plan-packet, mark-running, plan-sakana, plan-openai]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out immutable trusted tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.trusted_tool_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Download planning result evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-result-${{ inputs.run_id }}
          path: ${{ runner.temp }}/countyforge-result

      - name: Install the pinned Python toolchain
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Materialize the validated planning draft
        env:
          ISSUE_NUMBER: ${{ inputs.target_number }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
        run: |
          result_file="$(find "$RUNNER_TEMP/countyforge-result" -name countyforge-result.json -type f -print -quit 2>/dev/null || true)"
          if [ -z "$result_file" ]; then
            echo "::error::Planning provider result evidence is missing" >&2
            exit 2
          fi
          if ! jq -e '.ok == true and .disposition == "completed"' "$result_file" >/dev/null; then
            disposition="$(jq -r '.disposition // "unknown"' "$result_file" 2>/dev/null || printf 'invalid_result')"
            error_code="$(jq -r '.summary.error_code // "unknown"' "$result_file" 2>/dev/null || printf 'invalid_result')"
            # The runner already carries the failing JSON pointer and validator
            # for a schema rejection, bounded to structural facts. Without this
            # the message stayed `disposition=validation_failed
            # error_code=validation_failed`, which is what made run
            # 31269239926 hard to diagnose. Absent detail keeps the old message.
            detail=""
            if jq -e '.validation_detail.path != null and .validation_detail.validator != null' "$result_file" >/dev/null 2>&1; then
              detail_path="$(jq -r '.validation_detail.path' "$result_file")"
              detail_validator="$(jq -r '.validation_detail.validator' "$result_file")"
              detail=" path=$detail_path validator=$detail_validator"
            fi
            echo "::error::Planning provider failed before materialization: disposition=$disposition error_code=$error_code$detail" >&2
            exit 2
          fi
          plan_file="$(find "$RUNNER_TEMP/countyforge-result" -name countyforge-plan-result.json -type f -print -quit 2>/dev/null || true)"
          if [ -z "$plan_file" ]; then
            echo "::error::Planning provider completed without countyforge-plan-result.json" >&2
            exit 2
          fi
          cd trusted
          uv sync --frozen --package countyforge-github
          # `bash -e` used to kill the step the moment this exited nonzero, so the
          # bounded error document the CLI had already written was never read and
          # Actions printed only `Process completed with exit code 2`. Capture the
          # status, report allowlisted structural facts, then fail exactly as before.
          set +e
          uv run --package countyforge-github countyforge-github materialize-plan \
            --result "$plan_file" --publication-root "$GITHUB_WORKSPACE/trusted" \
            --issue-number "$ISSUE_NUMBER" --run-id "$COUNTYFORGE_RUN_ID" \
            > "$RUNNER_TEMP/countyforge-materialization.json"
          materialize_status=$?
          set -e
          if [ "$materialize_status" -ne 0 ]; then
            # Both envelopes, as at the run-request guards: a `KernelError`
            # nests its payload under `error`, and reading only the flat
            # shape would print the code alone for a schema failure.
            summary="code=$(jq -r '.disposition // .error.code // "unknown"' "$RUNNER_TEMP/countyforge-materialization.json" 2>/dev/null || printf 'unknown')"
            # Allowlisted keys only. `blocked_reasons` and the change name are
            # model prose and are never surfaced; the count and status are enough.
            for key in reason status blocked_reason_count path validator expected_pattern; do
              value="$(jq -r --arg k "$key" '(.details[$k] // .error.details[$k]) // empty' "$RUNNER_TEMP/countyforge-materialization.json" 2>/dev/null || true)"
              if [ -n "$value" ]; then
                summary="$summary $key=$value"
              fi
            done
            echo "::error::Planning materialization failed: $summary" >&2
            exit "$materialize_status"
          fi

      - name: Run trusted planning validation gates
        run: |
          cd trusted
          npx --yes @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive
          npx --yes @fission-ai/openspec@1.6.0 doctor
          uv run python scripts/check_doc_links.py
          uv run python scripts/check_repository_artifacts.py

      - name: Package the validated planning files
        env:
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
        run: |
          change_name="$(jq -r .change_name "$RUNNER_TEMP/countyforge-materialization.json")"
          test -n "$change_name" && test "$change_name" != "null"
          mkdir -p "$RUNNER_TEMP/countyforge-publication/openspec/changes"
          cp -R "trusted/openspec/changes/$change_name" \
            "$RUNNER_TEMP/countyforge-publication/openspec/changes/"
          cp "$RUNNER_TEMP/countyforge-materialization.json" \
            "$RUNNER_TEMP/countyforge-publication/"

      - name: Upload validated planning files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: countyforge-plan-publication-${{ inputs.run_id }}
          path: ${{ runner.temp }}/countyforge-publication
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  plan-publish:
    name: Publish planning draft and terminal state
    if: always() && inputs.command == 'plan' && needs.claim.result == 'success'
    needs: [claim, plan-packet, mark-running, plan-sakana, plan-openai, plan-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: countyforge-state-${{ github.repository_id }}-${{ inputs.target_type }}-${{ inputs.target_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out immutable trusted tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.trusted_tool_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download sanitized result evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-result-${{ inputs.run_id }}
          path: ${{ runner.temp }}/countyforge-result

      - name: Download planning packet provenance
        if: inputs.command == 'plan'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-planning-${{ inputs.run_id }}
          path: ${{ runner.temp }}/countyforge-planning

      - name: Download validated planning files
        if: needs.plan-validation.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-plan-publication-${{ inputs.run_id }}
          path: ${{ runner.temp }}/countyforge-publication

      - name: Install the pinned Python toolchain
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Resolve sanitized terminal disposition
        id: terminal
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          result_file="$(find "$RUNNER_TEMP/countyforge-result" -name countyforge-result.json -type f -print -quit 2>/dev/null || true)"
          exit_file="$(find "$RUNNER_TEMP/countyforge-result" -name countyforge-exit-code -type f -print -quit 2>/dev/null || true)"
          arguments=(resolve-terminal-result --command "$COMMAND")
          if [ -n "$result_file" ]; then
            arguments+=(--result "$result_file")
          fi
          if [ -n "$exit_file" ]; then
            arguments+=(--exit-code "$exit_file")
          fi
          uv run --package countyforge-github countyforge-github "${arguments[@]}" \
            > "$RUNNER_TEMP/countyforge-terminal.json"
          echo "state=$(jq -r .state "$RUNNER_TEMP/countyforge-terminal.json")" >> "$GITHUB_OUTPUT"
          echo "disposition=$(jq -r .disposition "$RUNNER_TEMP/countyforge-terminal.json")" >> "$GITHUB_OUTPUT"

      - name: Verify live planning publication lease
        id: verify-publication
        if: inputs.command == 'plan' && needs.plan-validation.result == 'success' && steps.terminal.outputs.state == 'succeeded' && steps.terminal.outputs.disposition == 'completed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          EXECUTION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          LEASE_NONCE: ${{ needs.claim.outputs.nonce }}
        run: |
          uv run --package countyforge-github countyforge-github verify-publication \
            --repository "$TARGET_REPOSITORY" \
            --status-comment-id "$STATUS_COMMENT_ID" \
            --trusted-bot-id 41898282 \
            --idempotency-key "$IDEMPOTENCY_KEY" \
            --run-id "$COUNTYFORGE_RUN_ID" \
            --workflow-run-id "$EXECUTION_WORKFLOW_RUN_ID" \
            --nonce "$LEASE_NONCE" \
            --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Publish the validated planning draft
        id: planning-publication
        continue-on-error: true
        if: inputs.command == 'plan' && needs.plan-validation.result == 'success' && steps.terminal.outputs.state == 'succeeded' && steps.terminal.outputs.disposition == 'completed' && steps.verify-publication.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          TARGET_SHA: ${{ inputs.trusted_tool_sha }}
          ISSUE_NUMBER: ${{ inputs.target_number }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp -R "$RUNNER_TEMP/countyforge-publication/openspec/changes/." \
            "$GITHUB_WORKSPACE/openspec/changes/"
          plan_file="$(find "$RUNNER_TEMP/countyforge-result" -name countyforge-plan-result.json -type f -print -quit)"
          test -n "$plan_file"
          planning_packet="$RUNNER_TEMP/countyforge-planning/countyforge-planning-packet.json"
          context_manifest="$RUNNER_TEMP/countyforge-planning/countyforge-context-manifest.json"
          test -f "$planning_packet" && test -f "$context_manifest"
          publication_result="$RUNNER_TEMP/countyforge-publication.json"
          publication_progress="$RUNNER_TEMP/countyforge-publication-progress.json"
          publication_normalized="$RUNNER_TEMP/countyforge-publication-normalized.json"
          set +e
          uv run --package countyforge-github countyforge-github publish-plan \
            --result "$plan_file" --repository "$TARGET_REPOSITORY" --default-branch main \
            --target-sha "$TARGET_SHA" --issue-number "$ISSUE_NUMBER" --run-id "$COUNTYFORGE_RUN_ID" \
            --publication-root "$GITHUB_WORKSPACE" \
            --planning-packet "$planning_packet" --context-manifest "$context_manifest" \
            --evidence-url "$EVIDENCE_URL" --already-materialized \
            --publication-progress "$publication_progress" > "$publication_result"
          publication_rc=$?
          set -e
          # Missing, malformed, non-object, or exit-code-inconsistent publisher
          # output becomes sanitized evidence with a nonzero effective code, so
          # finalization can never proceed on a document it could not read.
          uv run --package countyforge-github countyforge-github normalize-publication-result \
            --result "$publication_result" --progress "$publication_progress" \
            --exit-code "$publication_rc" > "$publication_normalized"
          effective_rc="$(jq -r '.exit_code // 5' "$publication_normalized" 2>/dev/null || echo 5)"
          case "$effective_rc" in ''|*[!0-9]*) effective_rc=5 ;; esac
          if [ "$effective_rc" -ne 0 ]; then
            disposition="$(jq -r '.disposition // "planning_publication_failed"' "$publication_normalized")"
            stage="$(jq -r '.details.stage // "unknown"' "$publication_normalized")"
            status="$(jq -r '.details.status // "unknown"' "$publication_normalized")"
            echo "::error::Planning publication failed: disposition=$disposition stage=$stage status=$status"
            exit "$effective_rc"
          fi
          echo "change_name=$(jq -r .outputs.change_name "$publication_normalized")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .outputs.branch "$publication_normalized")" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r .outputs.pr_number "$publication_normalized")" >> "$GITHUB_OUTPUT"
          echo "context_sha256=$(jq -r .outputs.context_manifest_sha256 "$publication_normalized")" >> "$GITHUB_OUTPUT"
          echo "result_sha256=$(sha256sum "$plan_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized planning publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: countyforge-plan-publisher-${{ inputs.run_id }}
          path: |
            ${{ runner.temp }}/countyforge-publication.json
            ${{ runner.temp }}/countyforge-publication-progress.json
            ${{ runner.temp }}/countyforge-publication-normalized.json
          if-no-files-found: warn
          retention-days: 14

      - name: Update canonical comment and check
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          EXECUTION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          LEASE_NONCE: ${{ needs.claim.outputs.nonce }}
          TERMINAL_STATE: ${{ steps.terminal.outputs.state }}
          TERMINAL_DISPOSITION: ${{ steps.terminal.outputs.disposition }}
          COMMAND: ${{ inputs.command }}
          PLANNING_VALIDATION_JOB_RESULT: ${{ needs.plan-validation.result }}
          PLANNING_PUBLICATION_OUTCOME: ${{ steps.planning-publication.outcome }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLANNING_CHANGE_NAME: ${{ steps.planning-publication.outputs.change_name }}
          PLANNING_BRANCH: ${{ steps.planning-publication.outputs.branch }}
          PLANNING_PR_NUMBER: ${{ steps.planning-publication.outputs.pr_number }}
          PLANNING_CONTEXT_SHA256: ${{ steps.planning-publication.outputs.context_sha256 }}
          PLANNING_RESULT_SHA256: ${{ steps.planning-publication.outputs.result_sha256 }}
        run: |
          if [ "$COMMAND" = "plan" ] && [ "$TERMINAL_STATE" = "succeeded" ] && \
             [ "$PLANNING_VALIDATION_JOB_RESULT" != "success" ]; then
            TERMINAL_STATE="failed"
            TERMINAL_DISPOSITION="planning_validation_failed"
          elif [ "$COMMAND" = "plan" ] && [ "$TERMINAL_STATE" = "succeeded" ] && \
             [ "$PLANNING_PUBLICATION_OUTCOME" != "success" ]; then
            TERMINAL_STATE="failed"
            TERMINAL_DISPOSITION="planning_publication_failed"
          fi
          planning_args=()
          if [ -n "$PLANNING_CHANGE_NAME" ]; then planning_args+=(--planning-change-name "$PLANNING_CHANGE_NAME"); fi
          if [ -n "$PLANNING_BRANCH" ]; then planning_args+=(--planning-branch "$PLANNING_BRANCH"); fi
          if [ -n "$PLANNING_PR_NUMBER" ]; then planning_args+=(--planning-pr-number "$PLANNING_PR_NUMBER"); fi
          if [ -n "$PLANNING_CONTEXT_SHA256" ]; then planning_args+=(--planning-context-sha256 "$PLANNING_CONTEXT_SHA256"); fi
          if [ -n "$PLANNING_RESULT_SHA256" ]; then planning_args+=(--planning-result-sha256 "$PLANNING_RESULT_SHA256"); fi
          uv run --package countyforge-github countyforge-github advance-run \
            --repository "$TARGET_REPOSITORY" \
            --status-comment-id "$STATUS_COMMENT_ID" \
            --trusted-bot-id 41898282 \
            --idempotency-key "$IDEMPOTENCY_KEY" \
            --run-id "$COUNTYFORGE_RUN_ID" \
            --workflow-run-id "$EXECUTION_WORKFLOW_RUN_ID" \
            --nonce "$LEASE_NONCE" \
            --target-state "$TERMINAL_STATE" \
            --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --disposition "$TERMINAL_DISPOSITION" \
            --evidence-url "$EVIDENCE_URL" \
            "${planning_args[@]}"

  publish:
    name: Publish non-planning terminal state
    if: always() && inputs.command != 'plan' && inputs.command != 'implement' && needs.claim.result == 'success'
    needs: [claim, prepare, mark-running, future-mode, review-sakana, review-openai]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: countyforge-state-${{ github.repository_id }}-${{ inputs.target_type }}-${{ inputs.target_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out immutable trusted tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.trusted_tool_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download sanitized result evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: countyforge-result-${{ inputs.run_id }}
          path: ${{ runner.temp }}/countyforge-result

      - name: Install the pinned Python toolchain
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Resolve sanitized terminal disposition
        id: terminal
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          result_file="$(find "$RUNNER_TEMP/countyforge-result" -name countyforge-result.json -type f -print -quit 2>/dev/null || true)"
          exit_file="$(find "$RUNNER_TEMP/countyforge-result" -name countyforge-exit-code -type f -print -quit 2>/dev/null || true)"
          arguments=(resolve-terminal-result --command "$COMMAND")
          if [ -n "$result_file" ]; then arguments+=(--result "$result_file"); fi
          if [ -n "$exit_file" ]; then arguments+=(--exit-code "$exit_file"); fi
          uv run --package countyforge-github countyforge-github "${arguments[@]}" \
            > "$RUNNER_TEMP/countyforge-terminal.json"
          echo "state=$(jq -r .state "$RUNNER_TEMP/countyforge-terminal.json")" >> "$GITHUB_OUTPUT"
          echo "disposition=$(jq -r .disposition "$RUNNER_TEMP/countyforge-terminal.json")" >> "$GITHUB_OUTPUT"

      - name: Update canonical comment and check
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ needs.claim.outputs.repository }}
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          COUNTYFORGE_RUN_ID: ${{ inputs.run_id }}
          EXECUTION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          LEASE_NONCE: ${{ needs.claim.outputs.nonce }}
          TERMINAL_STATE: ${{ steps.terminal.outputs.state }}
          TERMINAL_DISPOSITION: ${{ steps.terminal.outputs.disposition }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --package countyforge-github countyforge-github advance-run \
            --repository "$TARGET_REPOSITORY" \
            --status-comment-id "$STATUS_COMMENT_ID" \
            --trusted-bot-id 41898282 \
            --idempotency-key "$IDEMPOTENCY_KEY" \
            --run-id "$COUNTYFORGE_RUN_ID" \
            --workflow-run-id "$EXECUTION_WORKFLOW_RUN_ID" \
            --nonce "$LEASE_NONCE" \
            --target-state "$TERMINAL_STATE" \
            --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --disposition "$TERMINAL_DISPOSITION" \
            --evidence-url "$EVIDENCE_URL"
