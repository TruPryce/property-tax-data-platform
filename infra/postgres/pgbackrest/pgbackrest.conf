# pgBackRest configuration for the property-tax platform.
#
# Committable by construction: every value here is non-secret. The repository
# cipher passphrase is supplied at runtime as PGBACKREST_REPO1_CIPHER_PASS,
# resolved from Bitwarden by the Compose wrapper, because pgBackRest reads any
# option from a PGBACKREST_-prefixed environment variable. The AWS credentials
# are exchanged per invocation by the credential process below and never exist
# as stored key material.
#
# The identity ARNs are injected the same way rather than written here, so this
# file is identical on every host and a provider migration changes environment
# rather than configuration.

[global]
repo1-type=s3
repo1-s3-bucket=trupryce-property-tax-backups
repo1-path=/pgbackrest/platform
repo1-s3-region=us-east-1
repo1-s3-endpoint=s3.us-east-1.amazonaws.com
repo1-s3-uri-style=host

# Keyless. The wrapper execs aws_signing_helper, which exchanges the host
# workload certificate for short-lived credentials scoped to the backup role.
# No AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY exists anywhere in this system.
repo1-s3-key-type=process
repo1-s3-key-process=/usr/local/bin/pgbackrest-aws-credentials

# The repository is encrypted before anything leaves the host, so the bucket
# holds no readable database content even to an AWS principal that can read it.
repo1-cipher-type=aes-256-cbc

# Count, not time. A time-based window silently shortens the recoverable range
# when a scheduled full backup is missed; a count keeps four full cycles
# whatever the calendar did.
repo1-retention-full=4
repo1-retention-full-type=count

# Asynchronous archiving so archive_command returns immediately and a slow S3
# PUT never blocks a committing backend. The spool directory bounds what is in
# flight; see the runbook for the WAL-accumulation failure mode.
archive-async=y
spool-path=/var/spool/pgbackrest

# Checkpoint immediately rather than waiting for the next scheduled one, so a
# backup's start is close to the moment it was asked for.
start-fast=y

compress-type=zst
compress-level=3
process-max=2

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[platform]
pg1-path=/var/lib/postgresql/data
